- name: Fullstack Developer
  description: Rozwój i utrzymanie oprogramowania w środowisku produkcyjnym w ramach projektu komercyjnego. Implementacja nowych funkcjonalności w językach C++, Python, Kotlin, oraz usprawnień w istniejącej bazie kodu. Debugowanie, testowanie i refaktoryzacja kodu w celu zapewnienia jakości i stabilności rozwiązań. Współpraca z zespołem technicznym z wykorzystaniem GitHub.
  date: 05.2025 - obecnie
  image:

- name: Arpeggia
  description: Aplikacja mobilna na platformę Android napisana w języku Kotlin, wspierająca naukę gry na pianinie, będąca moim projektem inżynierskim. Zawiera model sieci neuronowej w języku Python, lokalną bazę danych Room, chmurowe bazy danych Firebase Reatime Database i Firebase Storage, UI napisane z wykorzystaniem JetPack Compose. Wykorzystano GitHub, Google Colab oraz Google Drive.
  date: 08.2024 – 12.2024
  image:

- name: Dziennik elektroniczny
  description: Aplikacja webowa napisana z wykorzystaniem ASP.Net (Web Forms), C#, zawierająca bazę danych Micfosoft SQL Server. Dostęp do danych bazy był realizowany poprzez klasy repozytoriów i encji. Projekt był wykonywany grupowo, gdzie moją rolą było stworzenie UI oraz zaimplementowanie funkcjonalności stron obecności oraz ocen z punktu widzenia użytkownika będącego uczniem, rodzicem lub nauczycielem, a także dodawania przez nauczyciela aktywności (sprawdziany, kartkówki,…). Wykorzystano oprogramowanie Miro oraz GitHub.
  date: 02.2024 – 06.2024
  image:

- name: Hedgehog Havoc
  description: Pierwszoosobowa gra RPG utworzona z wykorzystaniem silnika Unity oraz skryptów w C#. Projekt był wykonywany grupowo, gdzie moją rolą było utworzenie kreatora głównej postaci, NPC i głównej postaci (sprite’y, prefaby, animacje), przedmiotów w grze, efektu ząsteczkowego oraz dodanie muzyki i efektów dźwiękowych do gry. Wykorzystano oprogramowanie Jira oraz GitHub
  date: 02.2024 – 06.2024
  image:

- name: Przepiśnik
  description: Aplikacja okienkowa umożliwiająca zarządzanie przepisami, składnikami oraz tworzenie list zakupów, posiadająca funkcjonalność kalkulatora kalorii. Program, stworzony w języku C++ z wykorzystaniem obiektowości, C++/CLI Windows Forms, oferuje dynamiczne dodawanie przepisów i składników, obsługę wielu użytkowników oraz zapisywanie danych do plików tekstowych.
  date: 02.2023 – 06.2023
  image:
