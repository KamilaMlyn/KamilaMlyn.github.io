- name: Fullstack Developer
  description: Rozwój i utrzymanie oprogramowania w środowisku produkcyjnym w ramach projektu komercyjnego. Implementacja nowych funkcjonalności w językach C++, Python, Kotlin, oraz usprawnień w istniejącej bazie kodu. Debugowanie, testowanie i refaktoryzacja kodu w celu zapewnienia jakości i stabilności rozwiązań. Współpraca z zespołem technicznym z wykorzystaniem GitHub.
