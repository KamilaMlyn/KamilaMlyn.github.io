<div class="row">
    {% for l in site.data.learning %}
        <div class="6u 12u$(mobile)">
            <div class="item">
                {% if l.image %}
                    <a href="#" class="image fit"><img src="{{ l.image | relative_url }}"/></a>
                {% endif %}
                <h1>{{l.name}}</h1>
                <p>{{l.description}}</p>
            </div>
        </div>    
    {% endfor %}
</div>
