---
title: Certyfikaty
icon: fa-certificate
order: 2
---

{% for c in site.data.certificates | sort: 'date' | reverse %}
    <div class="cert-row">
        <div>
            {% if c.image %}
                <a href="#" class="image fit"><img src="{{ c.image | relative_url }}"/></a>
            {% endif %}
        </div>

        <div>{{c.name}}</div>

        <div>{{c.organization}}</div>

        <div>{{c.date}}</div>

        <div>
            {% if c.link %}
                <a href="{{ c.link }}" target="_blank" rel="noopener">Certyfikat</a>
            {% else %}
                <a href="#" target="_blank" rel="noopener">Certyfikat</a>
            {% endif %}
        </div>
    </div>
{% endfor %}
